[project]
name = "weixin-channel"
version = "0.1.0"
description = "Standalone WeChat iLink Bot channel extracted from Octop Gateway"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "liujianyeey-oss" },
]
keywords = ["wechat", "weixin", "ilink", "bot", "channel"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "aiohttp>=3.9",
    "cryptography>=42.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/liujianyeey-oss/weixin-channel"
Repository = "https://github.com/liujianyeey-oss/weixin-channel"
Issues = "https://github.com/liujianyeey-oss/weixin-channel/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weixin_channel"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
